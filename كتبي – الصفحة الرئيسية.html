  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }


  window.addEventListener('error', function(e) {

    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};


    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
   
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }

    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
   
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
     
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {

        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }
.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }


    template = template.replace(/<[a-z][^>]*>/gi, (tag) => /\s(?:src|href|srcset|poster|data|xlink:href)="blob:/i.test(tag) ? tag.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '') : tag);

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';

    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
   
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
  
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

ackground:#0B6B5A;color:#FFFFFF;font-weight:600;font-size:17px\">تسجيل الدخول<\u002Fa>\n<a class=\"press\" href=\"#services\" style=\"display:inline-flex;align-items:center;justify-content:center;min-height:50px;padding:0 26px;border-radius:12px;border:1px solid #9DB7B2;color:#0F2A2E;font-weight:500;font-size:17px\">تعرّف على الخدمات<\u002Fa>\n<\u002Fdiv>\n<\u002Fdiv>\n\n<div style=\"flex:1 1 340px;min-width:0;display:flex;justify-content:center\">\n<div style=\"width:100%;max-width:440px;box-sizing:border-box;background:#FFFFFF;border:1px solid #D3DEDC;border-radius:22px;padding:32px 32px 26px;display:flex;flex-direction:column;gap:22px\">\n<div style=\"display:flex;align-items:flex-end;gap:8px;height:250px;border-bottom:6px solid #0F2A2E;padding:0 6px\">\n<div style=\"width:34px;height:170px;background:#0B6B5A;border-radius:5px 5px 0 0;display:flex;flex-direction:column;gap:6px;padding-top:22px;align-items:center\"><div style=\"width:100%;height:5px;background:rgba(255,255,255,0.55)\"><\u002Fdiv><div style=\"width:100%;height:5px;background:rgba(255,255,255,0.55)\"><\u002Fdiv><\u002Fdiv>\n<div style=\"width:46px;height:222px;background:#0F2A2E;border-radius:5px 5px 0 0;display:flex;flex-direction:column;gap:6px;padding-top:30px;align-items:center\"><div style=\"width:100%;height:5px;background:#C98A1B\"><\u002Fdiv><\u002Fdiv>\n<div style=\"width:30px;height:140px;background:#8FB9B0;border-radius:5px 5px 0 0;display:flex;flex-direction:column;gap:6px;padding-top:18px;align-items:center\"><div style=\"width:100%;height:5px;background:rgba(15,42,46,0.55)\"><\u002Fdiv><\u002Fdiv>\n<div style=\"width:52px;height:236px;background:#C98A1B;border-radius:5px 5px 0 0;display:flex;flex-direction:column;gap:6px;padding-top:34px;align-items:center\"><div style=\"width:100%;height:5px;background:#0F2A2E\"><\u002Fdiv><div style=\"width:100%;height:5px;background:#0F2A2E\"><\u002Fdiv><\u002Fdiv>\n<div style=\"width:38px;height:190px;background:#0B6B5A;border-radius:5px 5px 0 0;display:flex;flex-direction:column;gap:6px;padding-top:26px;align-items:center\"><div style=\"width:100%;height:5px;background:rgba(255,255,255,0.55)\"><\u002Fdiv><\u002Fdiv>\n<div style=\"width:44px;height:158px;background:#DCEDE9;border:1px solid #9DB7B2;border-radius:5px 5px 0 0;display:flex;flex-direction:column;gap:6px;padding-top:20px;align-items:center;box-sizing:border-box\"><div style=\"width:100%;height:5px;background:#0B6B5A\"><\u002Fdiv><\u002Fdiv>\n<div style=\"width:32px;height:206px;background:#0F2A2E;border-radius:5px 5px 0 0;display:flex;flex-direction:column;gap:6px;padding-top:28px;align-items:center\"><div style=\"width:100%;height:5px;background:rgba(255,255,255,0.55)\"><\u002Fdiv><div style=\"width:100%;height:5px;background:rgba(255,255,255,0.55)\"><\u002Fdiv><\u002Fdiv>\n<\u002Fdiv>\n<div style=\"display:flex;flex-wrap:wrap;gap:8px\">\n<span style=\"font-size:15px;font-weight:600;color:#0B5A4B;background:#DCEDE9;padding:3px 14px;border-radius:999px\">حجز<\u002Fspan>\n<span style=\"font-size:15px;font-weight:600;color:#0B5A4B;background:#DCEDE9;padding:3px 14px;border-radius:999px\">استئجار<\u002Fspan>\n<span style=\"font-size:15px;font-weight:600;color:#0B5A4B;background:#DCEDE9;padding:3px 14px;border-radius:999px\">شراء<\u002Fspan>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n\n<!-- SERVICES -->\n<div id=\"services\" style=\"width:100%;box-sizing:border-box;padding:72px 24px;background:#FFFFFF;border-top:1px solid #D3DEDC;border-bottom:1px solid #D3DEDC\">\n<div style=\"max-width:1120px;margin:0 auto;display:flex;flex-direction:column;gap:40px\">\n<div style=\"display:flex;flex-direction:column;gap:10px;max-width:640px\">\n<h2 style=\"margin:0;font-family:'Noto Kufi Arabic','IBM Plex Sans Arabic',sans-serif;font-weight:700;font-size:clamp(26px,3.4vw,36px);line-height:1.5;text-wrap:balance\">ثلاث طرق للحصول على الكتاب<\u002Fh2>\n<p style=\"margin:0;color:#3F585D\">لكل طريقة صفحة خاصة بها في حسابك، حتى تعرف حالة كل كتاب في أي وقت.<\u002Fp>\n<\u002Fdiv>\n<div style=\"display:flex;flex-wrap:wrap;gap:20px\">\n\n<div style=\"flex:1 1 280px;min-width:0;box-sizing:border-box;background:#F3F6F5;border:1px solid #D3DEDC;border-radius:18px;padding:28px;display:flex;flex-direction:column;gap:14px\">\n<div style=\"width:48px;height:48px;border-radius:12px;background:#0B6B5A;display:flex;align-items:center;justify-content:center\">\n<svg aria-hidden=\"true\" width=\"26\" height=\"26\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"#FFFFFF\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M6 3h12v18l-6-4-6 4z\"><\u002Fpath><\u002Fsvg>\n<\u002Fdiv>\n<h3 style=\"margin:0;font-family:'Noto Kufi Arabic','IBM Plex Sans Arabic',sans-serif;font-weight:700;font-size:22px\">حجز الكتب<\u002Fh3>\n<p style=\"margin:0;color:#3F585D\">احجز نسختك قبل وصولك. تحتفظ لك المكتبة بالكتاب خلال مدة الحجز، وترى في حسابك موعد انتهاء الحجز.<\u002Fp>\n<\u002Fdiv>\n\n<div style=\"flex:1 1 280px;min-width:0;box-sizing:border-box;background:#F3F6F5;border:1px solid #D3DEDC;border-radius:18px;padding:28px;display:flex;flex-direction:column;gap:14px\">\n<div style=\"width:48px;height:48px;border-radius:12px;background:#0B6B5A;display:flex;align-items:center;justify-content:center\">\n<svg aria-hidden=\"true\" width=\"26\" height=\"26\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"#FFFFFF\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><rect x=\"3\" y=\"5\" width=\"18\" height=\"16\" rx=\"2\"><\u002Frect><path d=\"M3 10h18M8 3v4M16 3v4\"><\u002Fpath><\u002Fsvg>\n<\u002Fdiv>\n<h3 style=\"margin:0;font-family:'Noto Kufi Arabic','IBM Plex Sans Arabic',sans-serif;font-weight:700;font-size:22px\">استئجار الكتب<\u002Fh3>\n<p style=\"margin:0;color:#3F585D\">استأجر الكتاب لمدة محددة وأعده في موعده. يظهر لك تاريخ الإرجاع، وتُسجَّل أي مخالفة تأخير على بطاقتك.<\u002Fp>\n<\u002Fdiv>\n\n<div style=\"flex:1 1 280px;min-width:0;box-sizing:border-box;background:#F3F6F5;border:1px solid #D3DEDC;border-radius:18px;padding:28px;display:flex;flex-direction:column;gap:14px\">\n<div style=\"width:48px;height:48px;border-radius:12px;background:#0B6B5A;display:flex;align-items:center;justify-content:center\">\n<svg aria-hidden=\"true\" width=\"26\" height=\"26\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"#FFFFFF\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M5 8h14l-1 12H6z\"><\u002Fpath><path d=\"M9 8a3 3 0 0 1 6 0\"><\u002Fpath><\u002Fsvg>\n<\u002Fdiv>\n<h3 style=\"margin:0;font-family:'Noto Kufi Arabic','IBM Plex Sans Arabic',sans-serif;font-weight:700;font-size:22px\">شراء الكتب<\u002Fh3>\n<p style=\"margin:0;color:#3F585D\">اشترِ نسختك الخاصة إذا أردت الاحتفاظ بالكتاب. تُخصم النسخة من المستودع مباشرة ليبقى المتاح دقيقاً.<\u002Fp>\n<\u002Fdiv>\n\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n\n<!-- MANAGER -->\n<div id=\"manager\" style=\"width:100%;box-sizing:border-box;padding:80px 24px;background:#0F2A2E;color:#FFFFFF\">\n<div style=\"max-width:1120px;margin:0 auto;display:flex;flex-wrap:wrap;align-items:flex-start;gap:48px\">\n<div style=\"flex:1 1 420px;min-width:0;display:flex;flex-direction:column;gap:30px\">\n<div style=\"display:flex;flex-direction:column;gap:10px\">\n<span style=\"font-size:14px;font-weight:600;letter-spacing:0.04em;color:#E7B75B\">لوحة مدير المكتبة<\u002Fspan>\n<h2 style=\"margin:0;font-family:'Noto Kufi Arabic','IBM Plex Sans Arabic',sans-serif;font-weight:700;font-size:clamp(26px,3.4vw,36px);line-height:1.5;text-wrap:balance\">المدير يدير البطاقات والمخالفات والمستودع من حساب واحد<\u002Fh2>\n<\u002Fdiv>\n<div style=\"display:flex;flex-direction:column;gap:22px\">\n\n<div style=\"display:flex;gap:16px;align-items:flex-start\">\n<div style=\"flex:0 0 44px;width:44px;height:44px;border-radius:11px;background:#16403F;display:flex;align-items:center;justify-content:center\">\n<svg aria-hidden=\"true\" width=\"24\" height=\"24\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"#E7B75B\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><rect x=\"3\" y=\"5\" width=\"18\" height=\"14\" rx=\"2\"><\u002Frect><circle cx=\"9\" cy=\"11\" r=\"2\"><\u002Fcircle><path d=\"M14 10h4M14 14h4M6 16c.5-1.5 1.5-2 3-2s2.5.5 3 2\"><\u002Fpath><\u002Fsvg>\n<\u002Fdiv>\n<div style=\"min-width:0\">\n<h3 style=\"margin:0 0 2px;font-size:19px;font-weight:600\">إصدار البطاقات<\u002Fh3>\n<p style=\"margin:0;color:#BCD0CD\">يصدر بطاقة العضوية للعضو الجديد ويربطها بحسابه.<\u002Fp>\n<\u002Fdiv>\n<\u002Fdiv>\n\n<div style=\"display:flex;gap:16px;align-items:flex-start\">\n<div style=\"flex:0 0 44px;width:44px;height:44px;border-radius:11px;background:#16403F;display:flex;align-items:center;justify-content:center\">\n<svg aria-hidden=\"true\" width=\"24\" height=\"24\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"#E7B75B\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M12 3l10 18H2z\"><\u002Fpath><path d=\"M12 10v5M12 18v.01\"><\u002Fpath><\u002Fsvg>\n<\u002Fdiv>\n<div style=\"min-width:0\">\n<h3 style=\"margin:0 0 2px;font-size:19px;font-weight:600\">تسجيل المخالفات<\u002Fh3>\n<p style=\"margin:0;color:#BCD0CD\">يسجّل مخالفة التأخير أو التلف على بطاقة العضو مع ذكر السبب.<\u002Fp>\n<\u002Fdiv>\n<\u002Fdiv>\n\n<div style=\"display:flex;gap:16px;align-items:flex-start\">\n<div style=\"flex:0 0 44px;width:44px;height:44px;border-radius:11px;background:#16403F;display:flex;align-items:center;justify-content:center\">\n<svg aria-hidden=\"true\" width=\"24\" height=\"24\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"#E7B75B\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M3 7l9-4 9 4v10l-9 4-9-4z\"><\u002Fpath><path d=\"M3 7l9 4 9-4M12 11v10\"><\u002Fpath><\u002Fsvg>\n<\u002Fdiv>\n<div style=\"min-width:0\">\n<h3 style=\"margin:0 0 2px;font-size:19px;font-weight:600\">مراقبة المستودع<\u002Fh3>\n<p style=\"margin:0;color:#BCD0CD\">يعرف كم نسخة بقيت من كل كتاب، ويلاحظ الكتب التي توشك أن تنفد.<\u002Fp>\n<\u002Fdiv>\n<\u002Fdiv>\n\n<\u002Fdiv>\n<\u002Fdiv>\n\n<div style=\"flex:1 1 400px;min-width:0;background:#FFFFFF;color:#0F2A2E;border-radius:20px;padding:26px 26px 20px;display:flex;flex-direction:column;gap:16px\">\n<div style=\"display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px\">\n<h3 style=\"margin:0;font-size:19px;font-weight:600\">المستودع<\u002Fh3>\n<span style=\"font-size:13px;color:#4A6368;background:#EAF0EF;padding:2px 12px;border-radius:999px\">بيانات توضيحية<\u002Fspan>\n<\u002Fdiv>\n<div style=\"overflow-x:auto\">\n<div style=\"min-width:340px;display:flex;flex-direction:column\">\n<div style=\"display:flex;gap:12px;padding:8px 0;border-bottom:2px solid #0F2A2E;font-size:14px;font-weight:600;color:#4A6368\">\n<span style=\"flex:1 1 0;min-width:0\">الكتاب<\u002Fspan>\n<span style=\"flex:0 0 90px;text-align:center\">النسخ المتبقية<\u002Fspan>\n<span style=\"flex:0 0 76px;text-align:center\">الحالة<\u002Fspan>\n<\u002Fdiv>\n<sc-for list=\"{{rows}}\" as=\"row\" hint-placeholder-count=\"4\">\n<div style=\"display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid #D3DEDC;font-size:16px\">\n<span style=\"flex:1 1 0;min-width:0\">{{row.title}}<\u002Fspan>\n<span style=\"flex:0 0 90px;text-align:center;font-variant-numeric:tabular-nums;font-weight:600\">{{row.count}}<\u002Fspan>\n<span style=\"flex:0 0 76px;display:flex;justify-content:center\">\n<sc-if value=\"{{row.ok}}\" hint-placeholder-val=\"{{true}}\"><span style=\"font-size:14px;font-weight:600;padding:2px 12px;border-radius:999px;background:#DCEDE9;color:#0B5A4B\">متوفر<\u002Fspan><\u002Fsc-if>\n<sc-if value=\"{{row.low}}\" hint-placeholder-val=\"{{false}}\"><span style=\"font-size:14px;font-weight:600;padding:2px 12px;border-radius:999px;background:#FBEBC8;color:#5F3A05\">منخفض<\u002Fspan><\u002Fsc-if>\n<sc-if value=\"{{row.out}}\" hint-placeholder-val=\"{{false}}\"><span style=\"font-size:14px;font-weight:600;padding:2px 12px;border-radius:999px;background:#F6D9D5;color:#7A2318\">نفد<\u002Fspan><\u002Fsc-if>\n<\u002Fspan>\n<\u002Fdiv>\n<\u002Fsc-for>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n\n<!-- HOW -->\n<div id=\"how\" style=\"width:100%;box-sizing:border-box;padding:80px 24px\">\n<div style=\"max-width:1120px;margin:0 auto;display:flex;flex-direction:column;gap:40px\">\n<h2 style=\"margin:0;font-family:'Noto Kufi Arabic','IBM Plex Sans Arabic',sans-serif;font-weight:700;font-size:clamp(26px,3.4vw,36px);line-height:1.5;text-wrap:balance\">كيف تبدأ<\u002Fh2>\n<div style=\"display:flex;flex-wrap:wrap;gap:20px\">\n\n<div style=\"flex:1 1 260px;min-width:0;display:flex;flex-direction:column;gap:12px;border-top:3px solid #0B6B5A;padding-top:18px\">\n<span style=\"font-family:'Noto Kufi Arabic','IBM Plex Sans Arabic',sans-serif;font-weight:700;font-size:15px;color:#0B6B5A\">الخطوة الأولى<\u002Fspan>\n<h3 style=\"margin:0;font-size:21px;font-weight:600\">سجّل الدخول<\u002Fh3>\n<p style=\"margin:0;color:#3F585D\">ادخل بحساب العضو، أو بحساب مدير المكتبة إن كنت مسؤولاً عنها.<\u002Fp>\n<\u002Fdiv>\n\n<div style=\"flex:1 1 260px;min-width:0;display:flex;flex-direction:column;gap:12px;border-top:3px solid #0B6B5A;padding-top:18px\">\n<span style=\"font-family:'Noto Kufi Arabic','IBM Plex Sans Arabic',sans-serif;font-weight:700;font-size:15px;color:#0B6B5A\">الخطوة الثانية<\u002Fspan>\n<h3 style=\"margin:0;font-size:21px;font-weight:600\">اختر الكتاب والطريقة<\u002Fh3>\n<p style=\"margin:0;color:#3F585D\">ابحث عن الكتاب، ثم احجزه أو استأجره أو اشتره.<\u002Fp>\n<\u002Fdiv>\n\n<div style=\"flex:1 1 260px;min-width:0;display:flex;flex-direction:column;gap:12px;border-top:3px solid #0B6B5A;padding-top:18px\">\n<span style=\"font-family:'Noto Kufi Arabic','IBM Plex Sans Arabic',sans-serif;font-weight:700;font-size:15px;color:#0B6B5A\">الخطوة الثالثة<\u002Fspan>\n<h3 style=\"margin:0;font-size:21px;font-weight:600\">استلمه وتابع حسابك<\u002Fh3>\n<p style=\"margin:0;color:#3F585D\">تجد في صفحتك حجوزاتك وتواريخ الإرجاع وأي مخالفات على بطاقتك.<\u002Fp>\n<\u002Fdiv>\n\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n\n<!-- LOGIN -->\n<div id=\"login\" style=\"width:100%;box-sizing:border-box;padding:80px 24px;background:#DCEDE9;border-top:1px solid #BFD8D2\">\n<div style=\"max-width:1120px;margin:0 auto;display:flex;flex-wrap:wrap;align-items:center;gap:48px\">\n<div style=\"flex:1 1 380px;min-width:0;display:flex;flex-direction:column;gap:16px\">\n<h2 style=\"margin:0;font-family:'Noto Kufi Arabic','IBM Plex Sans Arabic',sans-serif;font-weight:700;font-size:clamp(26px,3.4vw,36px);line-height:1.5;text-wrap:balance\">ادخل إلى حسابك<\u002Fh2>\n<p style=\"margin:0;max-width:460px;color:#2F4A4F\">اختر نوع الحساب ثم سجّل الدخول لتبدأ الحجز والاستئجار والشراء، أو لتدير البطاقات والمخالفات والمستودع.<\u002Fp>\n<\u002Fdiv>\n\n<div style=\"flex:1 1 380px;min-width:0;display:flex;justify-content:center\">\n<div style=\"width:100%;max-width:460px;box-sizing:border-box;background:#FFFFFF;border:1px solid #BFD0CD;border-radius:20px;padding:30px;display:flex;flex-direction:column;gap:20px\">\n<div style=\"display:flex;gap:10px\" role=\"group\" aria-label=\"نوع الحساب\">\n<button class=\"seg\" type=\"button\" aria-pressed=\"{{isMember}}\" sc-camel-on-click=\"{{pickMember}}\">عضو<\u002Fbutton>\n<button class=\"seg\" type=\"button\" aria-pressed=\"{{isManager}}\" sc-camel-on-click=\"{{pickManager}}\">مدير المكتبة<\u002Fbutton>\n<\u002Fdiv>\n<div style=\"display:flex;flex-direction:column;gap:6px\">\n<label for=\"login-id\" style=\"font-size:15px;font-weight:500\">{{idLabel}}<\u002Flabel>\n<input class=\"field\" id=\"login-id\" type=\"text\" autocomplete=\"username\">\n<\u002Fdiv>\n<div style=\"display:flex;flex-direction:column;gap:6px\">\n<label for=\"login-pass\" style=\"font-size:15px;font-weight:500\">كلمة المرور<\u002Flabel>\n<input class=\"field\" id=\"login-pass\" type=\"password\" autocomplete=\"current-password\">\n<\u002Fdiv>\n<button class=\"press\" type=\"button\" sc-camel-on-click=\"{{submit}}\" style=\"cursor:pointer;font-family:inherit;font-size:17px;font-weight:600;min-height:50px;border:0;border-radius:12px;background:#0B6B5A;color:#FFFFFF\">تسجيل الدخول<\u002Fbutton>\n<sc-if value=\"{{submitted}}\" hint-placeholder-val=\"{{false}}\">\n<p style=\"margin:0;font-size:15px;color:#5F3A05;background:#FBEBC8;border-radius:10px;padding:10px 14px\">هذه واجهة تعريفية. سيُربط تسجيل الدخول بنظام المكتبة في المرحلة التالية.<\u002Fp>\n<\u002Fsc-if>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n\n<!-- FOOTER -->\n<div style=\"width:100%;box-sizing:border-box;padding:28px 24px;background:#0F2A2E;color:#BCD0CD\">\n<div style=\"max-width:1120px;margin:0 auto;display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px 24px;font-size:15px\">\n<span style=\"font-family:'Noto Kufi Arabic','IBM Plex Sans Arabic',sans-serif;font-weight:700;font-size:20px;color:#FFFFFF\">كتبي<\u002Fspan>\n<span>مكتبة للحجز والاستئجار والشراء<\u002Fspan>\n<\u002Fdiv>\n<\u002Fdiv>\n\n<\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;$preview&quot;:{&quot;width&quot;:1280,&quot;height&quot;:3000}}\">\nclass Component extends DCLogic {\n  constructor(props) {\n    super(props);\n    this.state = { role: 'member', submitted: false };\n  }\n  renderVals() {\n    const isMember = this.state.role === 'member';\n    const data = [\n      { title: 'كتاب تجريبي أ', count: 12 },\n      { title: 'كتاب تجريبي ب', count: 3 },\n      { title: 'كتاب تجريبي ج', count: 0 },\n      { title: 'كتاب تجريبي د', count: 27 }\n    ];\n    return {\n      isMember: isMember,\n      isManager: !isMember,\n      idLabel: isMember ? 'البريد الإلكتروني أو رقم البطاقة' : 'اسم المستخدم',\n      submitted: this.state.submitted,\n      pickMember: () => this.setState({ role: 'member', submitted: false }),\n      pickManager: () => this.setState({ role: 'manager', submitted: false }),\n      submit: () => this.setState({ submitted: true }),\n      rows: data.map((d) => ({\n        title: d.title,\n        count: d.count,\n        ok: d.count > 5,\n        low: d.count > 0 && d.count <= 5,\n        out: d.count === 0\n      }))\n    };\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
